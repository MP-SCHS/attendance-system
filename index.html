<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salpointe Attendance</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="tabs">
        <button class="tab-btn active" onclick="showTab(event, 'log')">Log Attendance</button>
        <button class="tab-btn" onclick="showTab(event, 'status-tab')">Student Status</button>
        <button class="tab-btn" onclick="showTab(event, 'manual')">Manual Entry</button>
        <button class="tab-btn" onclick="showTab(event, 'global')">Global List</button>
    </nav>

    <div class="container">
        <section id="log" class="tab-content active">
            <div class="card">
                <h1>Log Attendance</h1>
                <button id="connectBtn">CONNECT ARDUINO</button>
                <p>System: <span id="status">Disconnected</span></p>
                <div class="display-box">
                    <p class="label">Last Scan</p>
                    <div id="lastID">------</div>
                </div>
            </div>
        </section>

        <section id="status-tab" class="tab-content">
            <div class="card wide-card">
                <h1>Student Status</h1>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr><th>Student</th><th>ID</th><th>State</th></tr>
                        </thead>
                        <tbody id="statusBody"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section id="manual" class="tab-content">
            <div class="card" id="manualCard">
                <h1 id="manualTitle">Manual Entry</h1>
                <h3 id="manualSubTitle">Enter student details below</h3>
                <input placeholder="Name" type="text" id="manualNameInput">
                <input placeholder="ID Number" type="number" id="manualIdInput">
                <select id="manualLocationSelect">
                    <option selected disabled>Select Location</option>
                    <option>Enter</option>
                    <option>Bathroom</option>
                    <option>Nurse</option>
                    <option>Library</option>
                    <option>Front Office</option>
                    <option>Counselor</option>
                    <option>Dean</option>
                    <option>Classroom</option>
                    <option>Learning Lab</option>
                    <option>Testing Center</option>
                </select>
                <button id="submitManualEntry">Submit</button>
            </div>
        </section>

        <section id="global" class="tab-content">
            <div class="card wide-card">
                <h1>Global Campus Overview</h1>
                <div id="loginOverlay">
                    <p>Enter Faculty Access Code:</p>
                    <input type="password" id="facultyPass" placeholder="Access Code">
                    <button id="loginBtn">Unlock List</button>
                </div>
                <div id="globalContent" style="display: none;">
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr><th>Student</th><th>ID</th><th>Location</th><th>Last Sync</th></tr>
                            </thead>
                            <tbody id="globalStatusBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
